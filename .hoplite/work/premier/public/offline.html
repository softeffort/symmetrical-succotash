<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Premier — нет сети</title>
<meta name="theme-color" content="#12110F"><link rel="icon" type="image/png" href="/icons/icon-192.png">
<style>html,body{height:100%;margin:0}body{display:flex;align-items:center;justify-content:center;background:#12110F;color:#F3EEE4;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
img{width:72px;height:72px;border-radius:18px;margin-bottom:18px}h1{font-size:22px;margin:0 0 8px}p{margin:0 0 20px;opacity:.7;max-width:340px}button{font:inherit;background:#E8A33D;color:#12110F;border:0;border-radius:10px;padding:10px 22px;cursor:pointer;font-weight:600}</style></head>
<body><main><img src="/icons/icon-192.png" alt=""><h1 id="t">Нет подключения к интернету</h1><p id="p">Premier работает онлайн. Проверьте сеть — страница откроется сама, как только связь вернётся.</p><button id="b" onclick="location.reload()">Обновить</button></main>
<script>if(/^en/i.test(navigator.language)&&!/premier_lang=ru/.test(document.cookie)){document.documentElement.lang='en';document.title='Premier — offline';t.textContent='No internet connection';p.textContent='Premier works online. Check your network — the page will reload once you are back.';b.textContent='Reload';}addEventListener('online',()=>location.reload());</script>
</body></html>
